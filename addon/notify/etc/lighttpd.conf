# etc/lighttpd.conf of lite-addon-notify (MIT): openccu-lite proxies /addons/notify/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/notify" {
    url.redirect = ("" => "/addons/notify/")
}
$HTTP["url"] =~ "^/addons/notify/" {
    proxy.server = ("/addons/notify/" => (("host" => "127.0.0.1", "port" => 8300)))
    server.errorfile-prefix = "/usr/local/addons/notify/www/lighttpd-error-"
}
